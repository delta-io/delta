name: "Set up pinned Unity Catalog build"
description: >-
  Publishes the pinned Unity Catalog jars to the runner's local Ivy and Maven repositories.
  Restores the cache for SPARK_VERSION (major.minor) and builds missing jars. When SPARK_VERSION
  is unset, the setup script uses its default version and those callers share a cache.
  Only designated producers save caches on master pushes.

inputs:
  save-cache:
    description: Whether this job produces the shared UC cache on a master push.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Restore pinned UC cache
      id: uc-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # ~/.ivy2/local is what sbt publishLocal writes to. ~/.m2 is for publishM2.
        path: |
          ~/.ivy2/local
          ~/.m2/repository/io/unitycatalog
        # Cache key hashes the setup script (so any script change invalidates) and includes the
        # Spark short version (so 4.0 and 4.1 don't fight over a single shared cache entry).
        key: uc-jars-${{ runner.os }}-spark${{ env.SPARK_VERSION }}-${{ hashFiles('project/scripts/setup_unitycatalog_main.sh') }}
    - name: Build Unity Catalog from pinned SHA
      shell: bash
      run: bash project/scripts/setup_unitycatalog_main.sh
    - name: Save pinned UC cache
      if: >-
        inputs.save-cache == 'true' && github.event_name == 'push' &&
        github.ref == 'refs/heads/master' && steps.uc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.ivy2/local
          ~/.m2/repository/io/unitycatalog
        key: uc-jars-${{ runner.os }}-spark${{ env.SPARK_VERSION }}-${{ hashFiles('project/scripts/setup_unitycatalog_main.sh') }}
