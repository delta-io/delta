name: Run Delta Spark tests
description: >-
  Run one Delta Spark test shard: restore the SBT cache, publish the pinned Unity Catalog
  build, run the structured-logging style check, and run the sharded Scala/Java tests.
  Assumes prepare-spark-env already ran (JDK installed; source-build Spark env exported via
  GITHUB_ENV when applicable). The calling job must run actions/checkout first.

inputs:
  spark-version:
    description: Spark version (short version or "master") for this matrix row.
    required: true
  scala:
    description: Scala version for this matrix row.
    required: true
  shard:
    description: Test shard index for this matrix row.
    required: true
  num-shards:
    description: Total number of shards (must match the shard list length in the matrix).
    required: false
    default: '8'

runs:
  using: composite
  steps:
    - name: Restore SBT cache
      id: sbt-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.sbt
          ~/.ivy2
          ~/.cache/coursier
        # Build-file changes refresh the key because GitHub caches are immutable.
        key: delta-sbt-v2-${{ runner.os }}-${{ runner.arch }}-spark${{ inputs.spark-version }}-scala${{ inputs.scala }}-${{ hashFiles('build.sbt', 'version.sbt', 'project/*.scala', 'project/*.sbt', 'project/project/*.sbt', 'project/build.properties', 'project/scripts/setup_unitycatalog_main.sh') }}
        # Reuse older downloads for this Spark/Scala pair; sbt fetches missing dependencies.
        restore-keys: delta-sbt-v2-${{ runner.os }}-${{ runner.arch }}-spark${{ inputs.spark-version }}-scala${{ inputs.scala }}-

    # Delta's sparkUnityCatalog module (part of sparkGroup) depends on APIs that are only in
    # unreleased UC. Publish the pinned UC build locally before sbt tries to resolve it.
    - name: Set up pinned Unity Catalog
      uses: ./.github/actions/setup-unitycatalog
      env:
        SPARK_VERSION: ${{ inputs.spark-version }}
      with:
        save-cache: ${{ inputs.shard == '0' }}

    - name: Select compiled cache key
      id: compiled-key
      shell: bash
      env:
        CACHE_PREFIX: delta-spark-compiled-v1-ubuntu24.04-${{ runner.arch }}-spark${{ inputs.spark-version }}-scala${{ inputs.scala }}-${{ env.SPARK_COMMIT || 'published' }}-${{ hashFiles('build.sbt', 'version.sbt', 'project/*.scala', 'project/*.sbt', 'project/project/*.sbt', 'project/build.properties', 'project/scripts/setup_unitycatalog_main.sh', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/sbt-config/**', 'run-tests.py', '.github/actions/run-delta-spark-tests/action.yml') }}
      run: |
        java_hash=$(sha256sum "$JAVA_HOME/release" | cut -d ' ' -f 1)
        echo "prefix=${CACHE_PREFIX}-${java_hash}-" >> "$GITHUB_OUTPUT"

    - name: Restore compiled Spark outputs
      id: compiled-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Zinc and resource-copy metadata let sbt remove outputs of deleted source/resource files.
        # Keep test distributions and runtime files out so each runner creates them from its inputs.
        path: |
          **/target/*classes
          **/target/scala-*/*classes
          **/target/zinc
          **/target/test-zinc
          **/target/scala-*/zinc
          **/target/scala-*/test-zinc
          **/target/sync
          **/target/test-sync
          **/target/scala-*/sync
          **/target/scala-*/test-sync
          !project/target/**
          !project/project/target/**
        key: ${{ steps.compiled-key.outputs.prefix }}${{ github.sha }}
        # Reuse earlier source revisions only with the same JDK, Spark, Scala and build settings.
        restore-keys: ${{ steps.compiled-key.outputs.prefix }}

    - name: Scala structured logging style check
      shell: bash
      run: |
        if [ -f ./dev/spark_structured_logging_style.py ]; then
            python3 ./dev/spark_structured_logging_style.py
        fi

    - name: Run Scala/Java tests
      shell: bash
      env:
        SCALA_VERSION: ${{ inputs.scala }}
        SPARK_VERSION: ${{ inputs.spark-version }}
        NUM_SHARDS: ${{ inputs.num-shards }}
        # SPARK_COMMIT / SPARK_ARTIFACT_VERSION are inherited from GITHUB_ENV (set by
        # prepare-spark-env for source-build rows; unset for published rows).
      run: |
        TEST_PARALLELISM_COUNT=4 python3 run-tests.py --group spark --shard ${{ inputs.shard }} --spark-version ${{ inputs.spark-version }} --no-clean

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-reports-spark${{ inputs.spark-version }}-shard${{ inputs.shard }}
        path: "**/target/test-reports/*.xml"
        retention-days: 7

    - name: Save SBT cache
      # Shard 0 produces each Spark/Scala dependency cache; Python, Iceberg and changelog restore it.
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        inputs.shard == '0' && steps.sbt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.sbt
          ~/.ivy2
          ~/.cache/coursier
        key: ${{ steps.sbt-cache.outputs.cache-primary-key }}

    - name: Save compiled Spark outputs
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        inputs.shard == '0' && steps.compiled-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          **/target/*classes
          **/target/scala-*/*classes
          **/target/zinc
          **/target/test-zinc
          **/target/scala-*/zinc
          **/target/scala-*/test-zinc
          **/target/sync
          **/target/test-sync
          **/target/scala-*/sync
          **/target/scala-*/test-sync
          !project/target/**
          !project/project/target/**
        key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
